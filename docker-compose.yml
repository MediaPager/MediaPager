# Portable: override these via a .env file or your shell; defaults work for a local run.
#   MPAGER_DATA_DIR     -> where the SQLite DB + app state persist on the host
#   MPAGER_MOVIES_DIR   -> host path to your movie library (mounted at /mnt/movies)
#   MPAGER_QNET_NETWORK -> QNAP qnet network name (gives the web container its own LAN IP)
#   MPAGER_WEB_IP       -> static LAN IP for the web container (must be free on your LAN)
networks:
  internal: {}
  qnet:
    external: true
    name: ${MPAGER_QNET_NETWORK:?Set MPAGER_QNET_NETWORK in .env (your QNAP qnet network name)}

services:
  mediapager-api:
    image: mediapager-api:latest
    container_name: mediapager-api
    restart: unless-stopped
    environment:
      # SQLite lives under /data, which is volume-mounted so it persists across rebuilds.
      MPAGER_AUTH_DB_PATH: /data/db/mediapager-auth.db
      ASPNETCORE_URLS: http://0.0.0.0:5000
      # First-run super-admin seed (only created if this email doesn't already exist).
      # The generated temporary password is printed once to the api container logs;
      # change it after first login, then you may remove this var.
      MPAGER_Auth__SeedEmail: ${MPAGER_SEED_EMAIL:?Set MPAGER_SEED_EMAIL in .env (initial admin email)}
      # Movie library mount (not yet used by the app, reserved).
      MPAGER_MOVIEMNT: /mnt/movies
    volumes:
      - ${MPAGER_DATA_DIR:?Set MPAGER_DATA_DIR in .env (host dir for DB/state)}:/data
      - ${MPAGER_MOVIES_DIR:?Set MPAGER_MOVIES_DIR in .env (host movie library dir)}:/mnt/movies
    networks:
      internal: {}
    # No published ports: stays private on the internal network; reached only via mediapager-web.

  mediapager-web:
    image: mediapager-web:latest
    container_name: mediapager-web
    restart: unless-stopped
    depends_on:
      - mediapager-api
    networks:
      # internal: reach mediapager-api by name; qnet: serve the SPA on its own LAN IP.
      internal: {}
      qnet:
        ipv4_address: ${MPAGER_WEB_IP:?Set MPAGER_WEB_IP in .env (free static LAN IP for the web UI)}
