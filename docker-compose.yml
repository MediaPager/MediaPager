services:
  mediapager:
    image: ${MEDIAPAGER_IMAGE:-mediapager/mediapager:latest}
    pull_policy: missing
    container_name: mediapager
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    ports:
      - "${MEDIAPAGER_PORT:-8080}:5000"
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5000
      MEDIAPAGER_DB_PATH: /data/db/mediapager-auth.db
      MEDIAPAGER_Plugins__Directory: /app/plugins
      MEDIAPAGER_Frontend__BaseUrl: ${MEDIAPAGER_BASE_URL:-http://localhost:8080}
      MEDIAPAGER_SEED_USER: ${MEDIAPAGER_SEED_USER:-admin@mediapager.local}
      MEDIAPAGER_SEED_PASS: ${MEDIAPAGER_SEED_PASS:-}
      MEDIAPAGER_EKEY: ${MEDIAPAGER_EKEY:-}
      MEDIAPAGER_TMDB_API_KEY: ${MEDIAPAGER_TMDB_API_KEY:-}
    volumes:
      - mediapager-data:/data
      - mediapager-community-plugins:/app/plugins/community
      - ${MEDIAPAGER_MEDIA_PATH:-./media}:/mnt/media:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  mediapager-data:
  mediapager-community-plugins:
