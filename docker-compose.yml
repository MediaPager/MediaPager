# Portable: override these via a .env file or your shell; defaults work for a local run.
#   MEDIAPAGER_DATA_DIR     -> where the SQLite DB + app state persist on the host
#   MEDIAPAGER_MOVIES_DIR   -> host path to your movie library (mounted at /mnt/movies)
#   MEDIAPAGER_QNET_NETWORK -> QNAP qnet network name (gives the web container its own LAN IP)
#   MEDIAPAGER_WEB_IP       -> static LAN IP for the web container (must be free on your LAN)
networks:
  internal: {}
  qnet:
    external: true
    name: ${MEDIAPAGER_QNET_NETWORK:?Set MEDIAPAGER_QNET_NETWORK in .env (your QNAP qnet network name)}

services:
  mediapager-api:
    image: mediapager-api:latest
    container_name: mediapager-api
    restart: unless-stopped
    environment:
      # SQLite lives under /data, which is volume-mounted so it persists across rebuilds.
      MEDIAPAGER_DB_PATH: ${MEDIAPAGER_DB_PATH:-/data/db/mediapager-auth.db}
      ASPNETCORE_URLS: http://0.0.0.0:5000
      # A blank seed user/password lets the API's normal appsettings/default behavior apply.
      MEDIAPAGER_SEED_USER: ${MEDIAPAGER_SEED_USER:-}
      MEDIAPAGER_SEED_PASS: ${MEDIAPAGER_SEED_PASS:-}
      MEDIAPAGER_EKEY: ${MEDIAPAGER_EKEY:-}
      MEDIAPAGER_TMDB_API_KEY: ${MEDIAPAGER_TMDB_API_KEY:-}
    volumes:
      - ${MEDIAPAGER_DATA_DIR:?Set MEDIAPAGER_DATA_DIR in .env (host dir for DB/state)}:/data
      - ${MEDIAPAGER_MOVIES_DIR:?Set MEDIAPAGER_MOVIES_DIR in .env (host movie library dir)}:/mnt/movies
    networks:
      internal: {}
    # No published ports: stays private on the internal network; reached only via mediapager-web.

  mediapager-web:
    image: mediapager-web:latest
    container_name: mediapager-web
    restart: unless-stopped
    depends_on:
      - mediapager-api
    networks:
      # internal: reach mediapager-api by name; qnet: serve the SPA on its own LAN IP.
      internal: {}
      qnet:
        ipv4_address: ${MEDIAPAGER_WEB_IP:?Set MEDIAPAGER_WEB_IP in .env (free static LAN IP for the web UI)}
