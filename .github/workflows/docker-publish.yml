name: Publish Docker image

on:
  push:
    branches:
      - master
    tags:
      - "v*"
    paths:
      - Dockerfile
      - .dockerignore
      - VERSION
      - docker-compose.yml
      - MediaPager.slnx
      - MediaPager.App.Api
      - MediaPager.App.Api/**
      - MediaPager.App.Core
      - MediaPager.App.Core/**
      - MediaPager.App.PluginContracts
      - MediaPager.App.PluginContracts/**
      - MediaPager.App.Ui
      - MediaPager.App.Ui/**
      - MediaPager.Plugins.Email.MailGun
      - MediaPager.Plugins.Email.MailGun/**
      - MediaPager.Plugins.Email.Smtp
      - MediaPager.Plugins.Email.Smtp/**
      - MediaPager.Plugins.Search.Local
      - MediaPager.Plugins.Search.Local/**
      - MediaPager.Plugins.Search.Tmdb
      - MediaPager.Plugins.Search.Tmdb/**
      - MediaPager.Plugins.Stream.Local
      - MediaPager.Plugins.Stream.Local/**
      - MediaPager.Plugins.Subtitles.OpenSubtitles
      - MediaPager.Plugins.Subtitles.OpenSubtitles/**
      - MediaPager.Plugins.Subtitles.Subdl
      - MediaPager.Plugins.Subtitles.Subdl/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read application version
        id: app_version
        shell: bash
        run: |
          version="$(tr -d '\r\n[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::VERSION must contain a semantic version, got '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate Docker Hub publishing settings
        env:
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_IMAGE" || { echo "::error::Set the DOCKERHUB_IMAGE repository variable"; exit 1; }
          test -n "$DOCKERHUB_USERNAME" || { echo "::error::Set the DOCKERHUB_USERNAME Actions secret"; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "::error::Set the DOCKERHUB_TOKEN Actions secret"; exit 1; }

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.app_version.outputs.version }}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ steps.app_version.outputs.version }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
