server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API → private container over the docker network (resolved by container name).
    # The API owns every non-static path (top-level routes like movies, tv-shows,
    # catalogs, catalog-items, me, search, sources, stream, downloads, subtitles,
    # media-types, catalog-types, local, artwork, settings, auth…). A hard-coded
    # prefix list would keep appending forever and stale lists silently served
    # index.html to API calls (that's what broke older deploys), so this catch-all
    # forwards anything that isn't an actual static file.
    location / {
        try_files $uri $uri/ @api;
    }

    location @api {
        proxy_pass http://mediapager-api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}